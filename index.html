<html lang="ro">

  <style>
    :root{--ink:#24352d;--muted:#708078;--line:#dfe8df;--cream:#f5f8f2;--paper:#fff;--green:#2f7654;--green2:#dcefe1;--gold:#d49b55;--shadow:0 16px 50px rgba(34,65,48,.10)}
    *{box-sizing:border-box} body{margin:0;color:var(--ink);background:var(--cream);font-family:'DM Sans',sans-serif} button,input,textarea,select{font:inherit} button{cursor:pointer;border:0}
    .shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#20392d;color:#f8fbf6;padding:28px 20px;display:flex;flex-direction:column}.brand{font:700 25px 'Playfair Display';letter-spacing:-.5px}.brand span{color:#a9d2a4}.tag{font-size:11px;color:#b9cdbb;margin-top:7px}.nav{margin-top:46px;display:grid;gap:8px}.nav button{background:transparent;color:#d6e5d7;text-align:left;padding:13px 14px;border-radius:10px}.nav button.active,.nav button:hover{background:#345a43;color:#fff}.side-bottom{margin-top:auto;font-size:12px;line-height:1.6;color:#b8cbb9}.main{padding:28px 38px 50px;max-width:1450px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.eyebrow{color:var(--green);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.h1{font:700 36px 'Playfair Display';margin:5px 0}.intro{color:var(--muted);margin:0}.btn{border-radius:10px;padding:11px 16px;font-weight:700}.btn.primary{background:var(--green);color:white;box-shadow:0 8px 20px #2f76543b}.btn.ghost{background:#eaf2e9;color:var(--green)}.btn.danger{background:#fff0ef;color:#a74339}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px}.stat .num{font-size:26px;font-weight:700}.stat small{color:var(--muted)}.toolbar{display:flex;gap:10px;margin-bottom:18px}.search{flex:1;position:relative}.search input{width:100%;padding:13px 15px 13px 40px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:0}.search:before{content:'⌕';position:absolute;left:15px;top:8px;font-size:23px;color:var(--muted)}select,input,textarea{border:1px solid var(--line);border-radius:9px;padding:11px;background:#fff;color:var(--ink);outline-color:var(--green)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 5px 20px #315b4110}.card-top{height:130px;background:linear-gradient(135deg,#daeada,#b3d5bb);position:relative;display:flex;align-items:center;justify-content:center;font-size:58px}.badge{position:absolute;top:12px;left:12px;background:#ffffffcc;border-radius:30px;padding:5px 9px;font-size:11px;font-weight:700}.card-body{padding:16px}.species{font:600 20px 'Playfair Display';line-height:1.15}.latin{font-size:13px;color:var(--muted);font-style:italic;margin-top:5px}.lot{font-size:12px;color:var(--green);font-weight:700;margin-top:12px}.card-actions{display:flex;gap:8px;margin-top:15px}.card-actions button{flex:1;padding:9px;border-radius:8px;font-size:12px;font-weight:700}.edit{background:#edf5ed;color:var(--green)}.qr{background:#20392d;color:#fff}.empty{padding:40px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:15px;grid-column:1/-1}.hidden{display:none!important}.modal-bg{position:fixed;inset:0;background:#1d322d88;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.modal{background:#fff;border-radius:18px;max-width:800px;width:100%;max-height:90vh;overflow:auto;padding:25px;box-shadow:var(--shadow)}.modal h2{font:700 26px 'Playfair Display';margin:0 0 18px}.close{float:right;background:#eef4ed;border-radius:50%;width:32px;height:32px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px;font-size:12px;font-weight:700}.field.full{grid-column:1/-1}.field textarea{min-height:80px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.qr-layout{display:grid;grid-template-columns:230px 1fr;gap:26px;align-items:start}.qr-box{min-height:230px;border:1px solid var(--line);border-radius:13px;display:flex;align-items:center;justify-content:center;background:#fff}.public{max-width:900px;margin:0 auto;padding:35px}.public-card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}.public-hero{padding:35px;background:linear-gradient(120deg,#dcefe1,#f6dfbc)}.public-hero h1{font:700 42px 'Playfair Display';margin:10px 0}.public-content{padding:30px}.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.info{border:1px solid var(--line);border-radius:12px;padding:15px}.info strong{display:block;font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em;margin-bottom:7px}.notice{background:#f2f7ed;border-left:4px solid var(--green);padding:13px;border-radius:8px;margin:18px 0;font-size:14px}
    @media(max-width:800px){.shell{display:block}.side{min-height:auto;padding:18px}.nav{margin-top:20px;display:flex;overflow:auto}.side-bottom{display:none}.main{padding:22px 16px}.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;gap:12px}.h1{font-size:30px}.formgrid,.info-grid,.qr-layout{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}}
  </style>
</head>
<body>

  <script>
    const seed=[

ente și parcuri.'],['Liriodendron tulipifera','','arbore','Arbore cu frunze specifice și flori în formă de lalea.'],['Betula pendula','White Silver','arbore','Scoarță albă, coroană elegantă, frunziș delicat.'],['Betula pendula','Purpurea','arbore','Frunziș purpuriu și scoarță albă.'],['Cercis siliquastrum','','arbore','Flori roz direct pe ramuri, înaintea frunzelor.'],['Quercus robur','','arbore','Stejar pedunculat, longeviv și viguros.'],['Quercus rubra','','arbore','Stejar roșu cu colorit autumnal spectaculos.'],['Fraxinus excelsior','','arbore','Frasin de talie mare, cu coroană amplă.'],['Fraxinus ornus','','arbore','Mărimea moderată și flori albe parfumate.'],['Fraxinus angustifolia','Raywood','arbore','Colorit autumnal roșu-purpuriu intens.'],['Tilia cordata','','arbore','Tei cu frunze mici și flori parfumate.'],['Tilia tomentosa','','arbore','Tei argintiu, rezistent și melifer.'],['Prunus serrulata','Amanogawa','arbore','Coroană columnară și flori roz pal.'],['Prunus serrulata','Royal Burgundy','arbore','Flori roz duble și frunziș purpuriu.'],['Prunus serrulata','Kanzan','arbore','Flori roz duble, abundente primăvara.'],['Catalpa bignonioides','Nana','arbore','Coroană globulară, frunze mari.'],['Carpinus betulus','','arbore','Carpen robust, bun pentru garduri și aliniamente.'],['Carpinus betulus','Fastigiata','arbore','Formă columnară, potrivită pentru spații înguste.'],['Liquidambar styraciflua','','arbore','Colorit autumnal în nuanțe de roșu, portocaliu și violet.'],['Platanus × acerifolia','','arbore','Arbore urban rezistent, cu scoarță decorativă.'],['Albizia julibrissin','Rosea','arbore','Flori roz, frunziș fin, aspect exotic.'],['Albizia julibrissin','Summer Chocolate','arbore','Frunziș brun-purpuriu și flori roz.'],['Robinia pseudoacacia','Umbraculifera','arbore','Coroană globulară, fără spini, ideală pentru aliniamente.'],['Morus alba','Pendula','arbore','Formă plângătoare, fructe comestibile.'],['Rhus typhina','','arbore','Frunziș autumnal intens, inflorescențe decorative.'],['Aesculus hippocastanum','','arbore','Castan ornamental cu flori albe și fructe mari.'],['Aesculus hippocastanum','Baumannii','arbore','Flori duble albe, fără fructe sau cu fructificare redusă.'],['Acer palmatum','Atropurpureum','arbore','Arțar japonez cu frunziș roșu-purpuriu.'],['Salix caprea','','arbore','Salcie rezistentă, cu mâțișori decorativi primăvara.'],['Salix integra','Hakuro Nishiki','arbore','Frunziș pestriț alb-roz, tulpini decorative.']
      ,['Begonia','Mix','anuală','Flori abundente și colorate; preferă lumină filtrată și substrat reavăn.'],['Tagetes','Vanilla','anuală','Crăițe cu flori crem, rezistente și ușor de întreținut.'],['Tagetes','Pigeon','anuală','Crăițe compacte, florifere, potrivite pentru borduri și ghivece.'],['Coleus','Black Dragon','anuală','Frunziș decorativ foarte închis, spectaculos în semiumbră.'],['Coleus','Verde','anuală','Frunziș verde decorativ, potrivit pentru combinații de vară.'],['Salvia','','anuală','Flori colorate și port compact; atrage polenizatorii.'],['Cineraria','','anuală','Frunziș argintiu și flori decorative; preferă temperaturi moderate.'],['Petunia','hibridă','anuală','Înflorire bogată și continuă; îndepărtați florile trecute.'],['Bellis','','anuală','Bănuței cu flori delicate, potriviți pentru sezonul răcoros.'],['Viola','','anuală','Panseluță cu flori colorate, rezistentă la temperaturi scăzute.'],['Cortaderia','roz','perenă','Iarbă ornamentală cu spice roz, volum și aspect arhitectural.'],['Cortaderia','alb','perenă','Iarbă ornamentală cu spice albe, elegante.'],['Pennisetum','Purple','perenă','Iarbă ornamentală cu spice violet-brune.'],['Stipa tenuissima','','perenă','Iarbă fină, ușoară, cu spice aurii mișcate de vânt.'],['Stipa pennata','','perenă','Iarbă ornamentală cu ariste lungi, argintii.'],['Lophantus','','perenă','Plantă aromatică și meliferă cu spice florale.'],['Echinacea','','perenă','Flori robuste, atractive pentru albine și fluturi.'],['Digitalis','','perenă','Inflorescențe înalte, tubulare; preferă semiumbra.'],['Rudbeckia','','perenă','Flori galbene cu centru brun, foarte rezistente.'],['Aquilegia','','perenă','Flori grațioase, în nuanțe variate, pentru zone luminoase.'],['Leucanthemum','','perenă','Margarete albe, florifere și ușor de asociat.'],['Campanula','','perenă','Flori în formă de clopoțel, potrivite pentru borduri și stâncării.']
    ];
    const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const key='floralot-records-v1';
    const makeRecord=(s,i)=>({id:'FL-'+String(i+1).padStart(3,'0'),genus:s[0],cultivar:s[1],type:s[2],desc:s[3],popular:s[0],lot:'LOT-2026-'+String(i+1).padStart(3,'0'),quantity:0,watering:'Udare regulată după uscarea primilor 2–3 cm de substrat.',fertilizing:'Fertilizare primăvara și la începutul verii, conform etichetei produsului.',care:'Plantare în sol bine drenat; îndepărtați florile trecute și monitorizați dăunătorii.',image:''});
    let records=JSON.parse(localStorage.getItem(key)||'null')||seed.map(makeRecord);
    seed.forEach((s,i)=>{const id='FL-'+String(i+1).padStart(3,'0');if(!records.some(r=>r.id===id))records.push(makeRecord(s,i));});
    const imageByGenus={'Berberis thunbergii':[1,2,3],'Weigela':[4,5,6],'Syringa vulgaris':[7,8,9],'Forsythia':[10],'Hibiscus syriacus':[11,12,13],'Spiraea':[14,15],'Euonymus':[16,17],'Pyracantha':[18,19],'Mahonia':[20],'Kerria':[21],'Lonicera':[22],'Chaenomeles':[23],'Buddleja':[24],'Photinia':[25,26],'Cornus':[27,28,29],'Cotinus':[30,31],'Prunus laurocerasus':[32,33,34],'Caryopteris':[35,36],'Cotoneaster':[37,38,39],'Philadelphus':[40,41],'Viburnum':[42,43,44],'Acer platanoides':[45,46],'Acer pseudoplatanus':[47],'Liriodendron':[48,49],'Betula':[50,51],'Cercis':[52,53],'Quercus':[54,55],'Fraxinus':[56,57,58],'Tilia':[59,60],'Prunus serrulata':[61,62,63],'Catalpa':[64],'Carpinus':[65,66],'Liquidambar':[67],'Platanus':[68],'Albizia':[69,70],'Robinia':[71],'Morus':[72],'Rhus':[73,74],'Aesculus':[75,76],'Acer palmatum':[77],'Salix caprea':[78],'Salix integra':[79,80]};
    records.forEach(r=>{if(r.quantity===undefined)r.quantity=0;if(location.protocol.startsWith('http')&&r.image.startsWith('assets/image'))r.image=r.image.slice(7);if(!r.image){const k=Object.keys(imageByGenus).find(k=>r.genus.startsWith(k));if(k){const arr=imageByGenus[k];const n=arr[Math.max(0,records.filter(x=>x.genus===r.genus).indexOf(r))%arr.length];r.image=(location.protocol.startsWith('http')?'':'assets/')+'image'+n+'.jpeg';}}}); save();
    let filter='all', query='';
    function save(){localStorage.setItem(key,JSON.stringify(records))}
    function icon(r){return r.type==='arbore'?'🌳':'🌿'}
    let publicCatalogQuery='';
    function publicCard(r){return `<article class="card"><div class="card-top" style="${r.image?`background-image:url('${esc(r.image)}');background-size:cover;background-position:center`:''}">${r.image?'':'🌿'}<span class="badge">${esc(r.type)}</span></div><div class="card-body"><div class="species">${esc(r.genus)}</div><div class="latin">${esc(r.cultivar||'specie')}</div><button class="btn primary" style="width:100%;margin-top:14px" onclick="showAvailability('${r.id}')">Vezi disponibilitatea</button></div></article>`}
    function renderPublicHome(){const shown=records.filter(r=>(r.genus+' '+r.cultivar+' '+r.popular).toLowerCase().includes(publicCatalogQuery.toLowerCase()));document.getElementById('app').innerHTML=`<main class="public"><div class="public-card"><div class="public-hero"><div class="eyebrow">FloraLot · catalog</div><h1>Plante pentru grădină</h1><p style="font-size:17px;line-height:1.6">Alege planta care îți place și descoperă fotografia, descrierea și recomandările de îngrijire.</p></div><div class="public-content"><div class="search"><input placeholder="Caută după specie sau varietate..." value="${esc(publicCatalogQuery)}" oninput="publicCatalogQuery=this.value;renderPublicHome()"></div><div class="grid" style="margin-top:18px">${shown.length?shown.map(publicCard).join(''):'<div class="empty">Nu am găsit plante pentru căutarea ta.</div>'}</div></div></div></main>`}
    function render(){
      const publicId=location.hash.startsWith('#public/')?location.hash.slice(8):null;
      if(publicId){renderPublic(publicId);return}
      if(location.hash.toLowerCase()!=='#admin'){renderPublicHome();return}
      const shown=records.filter(r=>(filter==='all'||r.type===filter)&&((r.genus+' '+r.cultivar+' '+r.popular+' '+r.lot).toLowerCase().includes(query.toLowerCase())));
      document.getElementById('app').innerHTML=`<div class="shell"><aside class="side"><div class="brand">Flora<span>Lot</span></div><div class="tag">LOTIZARE INTELIGENTĂ PENTRU PEPINIERĂ</div><nav class="nav"><button class="active">▦  Loturile mele</button><button onclick="openModal()">＋  Adaugă lot</button><button onclick="alert('Datele sunt salvate automat în browserul acestui dispozitiv.')">⚙  Setări</button></nav><div class="side-bottom">Fișele publice arată doar informațiile horticole. Observațiile interne și notițele de gestiune rămân ascunse.</div></aside><main class="main"><div class="top"><div><div class="eyebrow">Panou de control</div><h1>Loturile mele</h1><p class="intro">Gestionează plantele, etichetele și informațiile pentru beneficiari.</p></div><button class="btn primary" onclick="openModal()">＋ Lot nou</button></div><section class="stats"><div class="stat"><div class="num">${records.length}</div><small>specii / varietăți</small></div><div class="stat"><div class="num">${records.filter(r=>r.type==='arbust').length}</div><small>arbusti</small></div><div class="stat"><div class="num">${records.filter(r=>r.type==='arbore').length}</div><small>arbori</small></div><div class="stat"><div class="num">${records.filter(r=>r.image).length}</div><small>cu imagine</small></div></section><div class="toolbar"><div class="search"><input placeholder="Caută după specie, varietate sau lot..." value="${esc(query)}" oninput="query=this.value;render()"></div><select onchange="filter=this.value;render()"><option value="all">Toate plantele</option><option value="arbust" ${filter==='arbust'?'selected':''}>Arbuști</option><option value="arbore" ${filter==='arbore'?'selected':''}>Arbori</option></select><button class="btn ghost" onclick="exportData()">Export JSON</button></div><div class="grid">${shown.length?shown.map(card).join(''):'<div class="empty">Nu există rezultate pentru căutarea curentă.</div>'}</div></main></div>`;
    }
    function card(r){return `<article class="card"><div class="card-top" style="${r.image?`background-image:url('${esc(r.image)}');background-size:cover;background-position:center`:''}"><span class="badge">${r.type}</span>${r.image?'':icon(r)}</div><div class="card-body"><div class="species">${esc(r.genus)}</div><div class="latin">${esc(r.cultivar||'specie')}</div><div class="lot">${esc(r.lot)} · ${esc(r.id)}</div><div class="card-actions"><button class="edit" onclick="openModal('${r.id}')">Editează</button><button class="qr" onclick="openQr('${r.id}')">▦ Cod QR</button></div></div></article>`}
    function openModal(id){const r=records.find(x=>x.id===id)||{id:'',genus:'',cultivar:'',type:'arbust',popular:'',lot:'',desc:'',watering:'',fertilizing:'',care:'',image:'',internal:''};document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><button class="close" onclick="closeModal()">×</button><h2>${id?'Editează lotul':'Adaugă lot nou'}</h2><div class="formgrid"><label class="field">Denumire științifică<input id="f-genus" value="${esc(r.genus)}"></label><label class="field">Soi / varietate<input id="f-cultivar" value="${esc(r.cultivar)}"></label><label class="field">Tip<select id="f-type"><option ${r.type==='arbust'?'selected':''}>arbust</option><option ${r.type==='arbore'?'selected':''}>arbore</option></select></label><label class="field">Lot / cod intern<input id="f-lot" value="${esc(r.lot)}"></label><label class="field">Denumire populară<input id="f-popular" value="${esc(r.popular)}"></label><label class="field">URL imagine (opțional)<input id="f-image" value="${esc(r.image)}" placeholder="https://..."></label><label class="field full">Descriere pentru beneficiar<textarea id="f-desc">${esc(r.desc)}</textarea></label><label class="field">Când se udă<textarea id="f-watering">${esc(r.watering)}</textarea></label><label class="field">Când se fertilizează<textarea id="f-fertilizing">${esc(r.fertilizing)}</textarea></label><label class="field full">Mod de îngrijire<textarea id="f-care">${esc(r.care)}</textarea></label><label class="field full">Notițe interne — nu apar după scanarea QR<textarea id="f-internal">${esc(r.internal||'')}</textarea></label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Anulează</button><button class="btn primary" onclick="saveRecord('${id}')">Salvează</button></div></div></div>`)}
    function closeModal(){document.getElementById('modal')?.remove()}
    function saveRecord(id){const r={id:id||'FL-'+String(records.length+1).padStart(3,'0'),genus:document.getElementById('f-genus').value,cultivar:document.getElementById('f-cultivar').value,type:document.getElementById('f-type').value,lot:document.getElementById('f-lot').value,popular:document.getElementById('f-popular').value,image:document.getElementById('f-image').value,desc:document.getElementById('f-desc').value,watering:document.getElementById('f-watering').value,fertilizing:document.getElementById('f-fertilizing').value,care:document.getElementById('f-care').value,internal:document.getElementById('f-internal').value};if(id)records=records.map(x=>x.id===id?r:x);else records.push(r);save();closeModal();render()}
    function openQr(id){const r=records.find(x=>x.id===id);document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><button class="close" onclick="closeModal()">×</button><h2>Cod QR · ${esc(r.lot)}</h2><div class="qr-layout"><div class="qr-box" id="qrcode"></div><div><p><strong>${esc(r.genus)} ${esc(r.cultivar)}</strong></p><p style="color:var(--muted);font-size:14px">La scanare, beneficiarul vede doar fișa publică. Notițele interne nu sunt incluse.</p><button class="btn primary" onclick="printLabel('${r.id}')">Printează eticheta</button><button class="btn ghost" style="margin-left:6px" onclick="location.hash='public/${r.id}';closeModal()">Previzualizare publică</button></div></div></div></div>`);new QRCode(document.getElementById('qrcode'),{text:location.href.split('#')[0]+'#public/'+r.id,width:200,height:200,colorDark:'#20392d',colorLight:'#ffffff'})}
    function renderPublic(id){const r=records.find(x=>x.id===id);if(!r){location.hash='';return}document.getElementById('app').innerHTML=`<main class="public"><button class="btn ghost" onclick="location.hash=''">← Înapoi la loturi</button><div class="public-card" style="margin-top:18px"><div class="public-hero"><div class="eyebrow">Fișă de identificare</div><h1>${esc(r.popular||r.genus)}</h1><div style="font-style:italic;font-size:18px">${esc(r.genus)} ${esc(r.cultivar)}</div></div><div class="public-content"><div class="notice">Această plantă face parte din lotul <strong>${esc(r.lot)}</strong>. Păstrați ghiveciul și urmați recomandările de mai jos.</div><p style="font-size:17px;line-height:1.6">${esc(r.desc)}</p><div class="info-grid"><div class="info"><strong>Udare</strong>${esc(r.watering)}</div><div class="info"><strong>Fertilizare</strong>${esc(r.fertilizing)}</div><div class="info" style="grid-column:1/-1"><strong>Îngrijire</strong>${esc(r.care)}</div></div></div></div></main>`}
    function printLabel(id){const r=records.find(x=>x.id===id);const url=location.href.split('#')[0]+'#public/'+r.id;const w=window.open('','_blank');w.document.write(`<html><head><title>Etichetă ${r.lot}</title><style>body{font-family:Arial;text-align:center;padding:20px}h2{margin:5px 0;font-size:18px}p{margin:5px;font-size:12px}#qr{margin:12px auto;width:200px}</style></head><body><h2>${esc(r.popular||r.genus)}</h2><p><i>${esc(r.genus)} ${esc(r.cultivar)}</i></p><div id="qr"></div><p>${esc(r.lot)}</p><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script><script>new QRCode(document.getElementById('qr'),{text:'${url}',width:200,height:200});setTimeout(()=>print(),500)<\/script></body></html>`);w.document.close()}
    function exportData(){const blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='floralot-loturi.json';a.click();URL.revokeObjectURL(a.href)}
    const publicPayload=r=>({popular:r.popular,genus:r.genus,cultivar:r.cultivar,lot:r.lot,type:r.type,desc:r.desc,watering:r.watering,fertilizing:r.fertilizing,care:r.care,image:r.image&&r.image.startsWith('data:')?'':r.image});
    const payloadToken=r=>btoa(unescape(encodeURIComponent(JSON.stringify(publicPayload(r))))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    const decodeToken=t=>{try{const b=t.replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(b+'='.repeat((4-b.length%4)%4)))))}catch(e){return null}};
    function renderPublicPayload(r){document.getElementById('app').innerHTML=`<main class="public"><div class="public-card"><div class="public-hero"><div class="eyebrow">Fișă de identificare</div><h1>${esc(r.popular||r.genus)}</h1><div style="font-style:italic;font-size:18px">${esc(r.genus)} ${esc(r.cultivar)}</div></div><div class="public-content">${r.image?`<img src="${esc(r.image)}" alt="${esc(r.popular||r.genus)}" style="width:100%;max-height:360px;object-fit:cover;border-radius:12px;margin-bottom:18px">`:''}<div class="notice">Această plantă face parte din lotul <strong>${esc(r.lot)}</strong>. Păstrați ghiveciul și urmați recomandările de mai jos.</div><p style="font-size:17px;line-height:1.6">${esc(r.desc)}</p><div class="info-grid"><div class="info"><strong>Udare</strong>${esc(r.watering)}</div><div class="info"><strong>Fertilizare</strong>${esc(r.fertilizing)}</div><div class="info" style="grid-column:1/-1"><strong>Îngrijire</strong>${esc(r.care)}</div></div></div></div></main>`}
    const baseRenderPublic=renderPublic;
    renderPublic=function(token){if(token.startsWith('data-')){const r=decodeToken(token.slice(5));if(r){renderPublicPayload(r);return}}baseRenderPublic(token)};
    const baseOpenQr=openQr;
    openQr=function(id){baseOpenQr(id);setTimeout(()=>{const r=records.find(x=>x.id===id),box=document.getElementById('qrcode');if(r&&box){box.innerHTML='';new QRCode(box,{text:location.href.split('#')[0]+'#public/data-'+payloadToken(r),width:200,height:200,colorDark:'#20392d',colorLight:'#ffffff'});const info=document.querySelector('#modal .qr-layout > div:nth-child(2)');if(info&&r.image)info.insertAdjacentHTML('afterbegin',`<img src="${esc(r.image)}" alt="Fotografia plantei" style="width:100%;max-width:220px;height:120px;object-fit:cover;border-radius:10px;margin-bottom:12px">`)}},0)};
    const basePrintLabel=printLabel;
    printLabel=function(id){const r=records.find(x=>x.id===id);if(!r){basePrintLabel(id);return}const url=location.href.split('#')[0]+'#public/data-'+payloadToken(r),w=window.open('','_blank');w.document.write(`<html><head><title>Etichetă ${esc(r.lot)}</title><style>body{font-family:Arial;text-align:center;padding:20px}h2{margin:5px 0;font-size:18px}p{margin:5px;font-size:12px}#qr{margin:12px auto;width:200px}</style></head><body><h2>${esc(r.popular||r.genus)}</h2><p><i>${esc(r.genus)} ${esc(r.cultivar)}</i></p><div id="qr"></div><p>${esc(r.lot)}</p><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script><script>new QRCode(document.getElementById('qr'),{text:'${url}',width:200,height:200});setTimeout(()=>print(),500)<\/script></body></html>`);w.document.close()};
    let pendingImageData='';
    function previewUpload(e){const f=e.target.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{const source=new Image();source.onload=()=>{const max=1000,scale=Math.min(1,max/Math.max(source.width,source.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(source.width*scale));canvas.height=Math.max(1,Math.round(source.height*scale));canvas.getContext('2d').drawImage(source,0,0,canvas.width,canvas.height);pendingImageData=canvas.toDataURL('image/jpeg',.78);const img=document.getElementById('upload-preview');if(img){img.src=pendingImageData;img.classList.remove('hidden')}};source.src=reader.result};reader.readAsDataURL(f)}
    const baseOpenModal=openModal;
    openModal=function(id){pendingImageData='';baseOpenModal(id);const field=document.createElement('label');field.className='field full';field.innerHTML='Imagine de pe calculator<input type="file" accept="image/*" onchange="previewUpload(event)"><img id="upload-preview" class="hidden" style="max-width:180px;max-height:120px;border-radius:9px;object-fit:cover;margin-top:8px">';document.querySelector('#modal .formgrid')?.appendChild(field);const current=document.getElementById('f-image')?.value;if(current&&current.startsWith('data:image')){pendingImageData=current;const img=document.getElementById('upload-preview');img.src=current;img.classList.remove('hidden')}};
    const baseSaveRecord=saveRecord;
    saveRecord=function(id){if(pendingImageData)document.getElementById('f-image').value=pendingImageData;baseSaveRecord(id);pendingImageData=''};
    function showAvailability(id){const r=records.find(x=>x.id===id);document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="availability"><div class="modal" style="max-width:420px;text-align:center"><button class="close" onclick="document.getElementById('availability')?.remove()">×</button><div class="eyebrow">Disponibilitate</div><h2>${esc(r.genus)} ${esc(r.cultivar)}</h2><div style="font-size:46px;font-weight:700;color:var(--green);margin:18px 0">${Number(r.quantity)||0}</div><div style="color:var(--muted)">bucăți disponibile</div><div class="modal-actions"><button class="btn ghost" onclick="document.getElementById('availability')?.remove()">Închide</button></div></div></div>`)}
    const baseOpenModalQuantity=openModal;
    openModal=function(id){baseOpenModalQuantity(id);const r=records.find(x=>x.id===id)||{quantity:0};const field=document.createElement('label');field.className='field';field.innerHTML='Cantitate disponibilă<input id="f-quantity" type="number" min="0" value="${Number(r.quantity)||0}">';document.querySelector('#modal .formgrid')?.appendChild(field)};
    const baseSaveRecordQuantity=saveRecord;
    saveRecord=function(id){const rid=id||'FL-'+String(records.length+1).padStart(3,'0');const q=Number(document.getElementById('f-quantity')?.value||0);baseSaveRecordQuantity(id);const rec=records.find(x=>x.id===rid);if(rec)rec.quantity=q;save();render()};
    const plantTypes=['arbust','arbore','graminee ornamentale','flori perene','flori anuale','flori bianuale','plante cataratoare','plante curgatoare','plante taratoare'];
    const baseOpenModalTypes=openModal;
    openModal=function(id){baseOpenModalTypes(id);const r=records.find(x=>x.id===id);const sel=document.getElementById('f-type');if(sel){sel.innerHTML=plantTypes.map(t=>`<option value="${t}" ${r?.type===t?'selected':''}>${t}</option>`).join('');if(r?.type&&!plantTypes.includes(r.type)){const o=document.createElement('option');o.value=r.type;o.textContent=r.type;o.selected=true;sel.appendChild(o)}}};
    const baseSaveRecordStable=saveRecord;
    saveRecord=function(id){try{const rid=id||'FL-'+String(records.length+1).padStart(3,'0'),existing=records.find(x=>x.id===id),record={id:rid,genus:document.getElementById('f-genus').value.trim(),cultivar:document.getElementById('f-cultivar').value.trim(),type:document.getElementById('f-type').value,popular:document.getElementById('f-popular').value.trim(),lot:document.getElementById('f-lot').value.trim(),quantity:Math.max(0,Number(document.getElementById('f-quantity')?.value||0)),desc:document.getElementById('f-desc').value,watering:document.getElementById('f-watering').value,fertilizing:document.getElementById('f-fertilizing').value,care:document.getElementById('f-care').value,internal:document.getElementById('f-internal').value,image:pendingImageData||document.getElementById('f-image').value.trim()};if(id)records=records.map(x=>x.id===id?record:x);else records.push(record);save();pendingImageData='';closeModal();render()}catch(err){console.error(err);alert('Nu am putut salva lotul. Verifică să fie completat numele speciei.')}};
    const baseRenderTypes=render;
    render=function(){baseRenderTypes();if(location.hash==='#admin'){const sel=document.querySelector('.toolbar select');if(sel){plantTypes.forEach(t=>{if(![...sel.options].some(o=>o.value===t)){const o=document.createElement('option');o.value=t;o.textContent=t;sel.appendChild(o)}})}}};
    async function loadWebPhotos(){const pending=records.filter(r=>(r.type==='anuală'||r.type==='perenă')&&!r.image);for(const r of pending){try{const q=encodeURIComponent((r.genus+' '+r.cultivar).trim()+' plant');const res=await fetch('https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+q+'&gsrnamespace=6&gsrlimit=1&prop=imageinfo&iiprop=url&iiurlwidth=700&format=json&origin=*');const data=await res.json();const page=Object.values(data.query?.pages||{})[0];const url=page?.imageinfo?.[0]?.thumburl||page?.imageinfo?.[0]?.url;if(url){r.image=url;r.imageSource='Wikimedia Commons';}}catch(e){console.warn('Imagine online indisponibilă pentru',r.genus)}}if(pending.some(r=>r.image)){save();render()}}
    window.addEventListener('hashchange',render);render();loadWebPhotos();
  </script>
</body>
</html>
